name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release_please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package:
    name: Build release assets
    needs: release_please
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_please.outputs.tag_name }}

      - name: Configure
        run: cmake --preset windows-release

      - name: Build
        run: cmake --build --preset windows-release

      - name: Test
        run: ctest --preset windows-release

      - name: Create GitHub package
        shell: pwsh
        run: >-
          ./tools/package_release.ps1
          -BuildDirectory build/preset-release
          -Version '${{ needs.release_please.outputs.version }}'

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ERNativeUI-${{ needs.release_please.outputs.version }}
          path: dist/release/ERNativeUI-${{ needs.release_please.outputs.version }}-windows-x64.zip
          if-no-files-found: error

      - name: Attach assets to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload '${{ needs.release_please.outputs.tag_name }}'
          'dist/release/ERNativeUI-${{ needs.release_please.outputs.version }}-windows-x64.zip'
          --clobber
