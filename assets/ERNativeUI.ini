[Logging]
; Set to 1 when troubleshooting or when collecting diagnostics for an issue.
EnableLog = 0

[Localization]
; "auto" follows Elden Ring's current Steam game language. To override it,
; use a lowercase identifier such as vietnamese. A matching file in locales
; translates host-owned text; the identifier is also reported to client mods.
Language = auto

[Runtime]
; Time without provider activity, with no draft active, before startup freezes.
RegistrationQuietMs = 750
; Absolute upper bound for startup registration. Late clients fail cleanly.
RegistrationMaxWaitMs = 5000
; Maximum conditional wait for Elden Ring's Steam API to initialize. This is
; not an unconditional delay: discovery releases immediately when ready. If
; the limit expires, menus continue with English localization fallback. This
; setting is ignored when Localization.Language is an explicit identifier.
SteamLanguageWaitMs = 5000
InjectionCooldownMs = 250

[GFX]
; Set to 0 to disable every in-memory GFX transformation. ERNativeUI then
; leaves the effective vanilla or mod-supplied GFX bytes unchanged and does
; not expose API 1.3 title-screen text. Custom tabs remain independent, but
; ERNativeUI-provided row expansion and injected TextInput/ColorPicker
; presentation are disabled.
; Restart the game after changing this setting.
EnableRuntimePatching = 1

[Tabs]
; Minimum System-tab layout capacity requested at startup. ERNativeUI can grow
; compatible GFX, but trusts only the selector's validated live count at run
; time. Files already providing more capacity are never reduced. API 1.3
; accepts 8 through 10. Ten is the hard native physical-slot ceiling; logical
; custom tabs beyond that remain available through the shifting tab viewport.
; Empty slots are not activated when fewer real tabs exist.
MinimumTabSlots = 8
; Number of visible slots kept between the selected tab and the edge before
; ERNativeUI shifts an overflowing tab strip. 1 anchors at the second slot.
NavigationMargin = 1
; With a mouse, hovering an overflow "..." cell reveals further tabs. Pointer
; movement resets the delay; controller L1/R1 navigation is unaffected.
MouseDwellEnabled = 1
MouseDwellInitialDelayMs = 250
MouseDwellRepeatDelayMs = 200
; Each successful automatic step shortens the next delay by this amount.
; Set to 0 for a fixed repeat cadence.
MouseDwellDecayMs = 20
MouseDwellMinimumDelayMs = 50

[TabOrder]
; Optional exact, case-sensitive custom-tab ordering overrides. Keys are
; reported in ERNativeUI-tabs.log as "provider_id/tab_id" when Logging.EnableLog
; is 1. Lower values appear first. Unknown or stale keys are harmless and are
; reported for diagnosis. Disabling logging leaves any older report untouched.
; my-mod/my-tab = 10

[Diagnostics]
; Detailed address, pagination, row-construction and callback traces. Enabling
; this can significantly slow the game, especially with many tabs or icons.
; Use only while troubleshooting, then set it back to 0.
EnableDiagnostics = 0
