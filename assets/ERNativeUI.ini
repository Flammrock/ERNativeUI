[Logging]
; Set to 1 when troubleshooting or when a maintainer requests a log.
EnableLog = 0

[Runtime]
; Time without provider activity, with no draft active, before startup freezes.
RegistrationQuietMs = 750
; Absolute upper bound for startup registration. Late clients fail cleanly.
RegistrationMaxWaitMs = 5000
InjectionCooldownMs = 250

[Diagnostics]
; Detailed address, pagination, row-construction and callback traces.
EnableDiagnostics = 0
